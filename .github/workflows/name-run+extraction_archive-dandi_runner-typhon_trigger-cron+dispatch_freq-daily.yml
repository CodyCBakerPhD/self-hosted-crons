name: Run DANDI log extraction

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ENV_PATH: "/mnt/s3-logs/dandi-s3-logs/name-s3logs_py-314_date-51426_env/"
  UV_PATH: "/mnt/s3-logs/dandi-s3-logs/uv"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  DUCT_OUTPUT_PREFIX: "/mnt/s3-logs/dandi-s3-logs/extraction_cache/.duct/{datetime}"

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  ProcessAccessLogs:
    needs: CheckTyphon
    name: Process access logs
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 2880  # 48 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run primary S3 log extraction
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: extract s3://dandiarchive-logs
          flags: --mode remote --inventory /mnt/s3-logs/dandi-s3-logs/inventory --limit 1500000
          entrypoint: 'dandis3logextraction'

      - name: Take snapshot for backup
        working-directory: /mnt/s3-logs/dandi-s3-logs/
        run: ./snapshots/restic backup ./extraction_cache --repo ./snapshots/backups/ --password-file ./snapshots/.restic-password --read-concurrency 16 --pack-size 128 --compression max --skip-if-unchanged

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, ProcessAccessLogs]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI log extraction failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-run+extraction_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-daily.yml
