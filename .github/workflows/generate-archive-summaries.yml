name: Generate archive summaries
on:
  workflow_call:
  workflow_dispatch:

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / GenerateArchiveSummaries / Typhon'
    # Action dashboard identified by 'Generate archive summaries'
    # Requirement settings identified as 'GenerateArchiveSummaries / Typhon'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Update archive summaries
        runs-on: self-hosted
        run: |
          source /data/dandi/s3-logs/conda/bin/activate s3_logs_cron
          s3logextraction update summaries --mode archive
