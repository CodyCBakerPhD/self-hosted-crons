# Separate action for the gargantuan dataset of DANDI:000108
name: Update microscopy summaries
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  CONDA_BASE_PATH: "/data/dandi/s3-logs/conda"
  CONDA_ENV_NAME: "s3_logs_cron"

jobs:

  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateMicroscopySummaries:
    needs: CheckTyphon
    name: Update microscopy summaries
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 1600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update IP indexes
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip indexes

      - name: Update microscopy summaries
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --pick 000108 --workers 1
          entrypoint: 'dandis3logextraction'

# Wait for the other summary updater to aggregate further

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateMicroscopySummaries]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI microscopy summary update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-update+microscopy+summaries_archive-dandi_trigger-cron+dispatch_freq-weekly.yml
