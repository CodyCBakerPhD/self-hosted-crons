name: Backup extraction
on:
  schedule:
    - cron: "0 10 * * 1"   # 6am EST every monday
  workflow_dispatch:

jobs:

  run:
    # Action dashboard identified by 'Backup extraction'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Bump previous backup, if any
        run: |
          [ -e /data/dandi/s3-logs/extraction_cache/records.backup ] && mv /data/dandi/s3-logs/extraction_cache/records.backup /data/dandi/s3-logs/extraction_cache/records.backup2 || true
          [ -e /data/dandi/s3-logs/extraction_cache/extraction.backup ] && mv /data/dandi/s3-logs/extraction_cache/extraction.backup /data/dandi/s3-logs/extraction_cache/extraction.backup2 || true
    
      - name: Generate fresh backup
        run: |
          cp -r /data/dandi/s3-logs/extraction_cache/records /data/dandi/s3-logs/extraction_cache/records.backup
          cp -r /data/dandi/s3-logs/extraction_cache/extraction /data/dandi/s3-logs/extraction_cache/extraction.backup

      - name: Remove previous backup
        run: |
          rm -rf /data/dandi/s3-logs/extraction_cache/records.backup2
          rm -rf /data/dandi/s3-logs/extraction_cache/extraction.backup2
