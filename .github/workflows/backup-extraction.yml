name: Backup extraction
on:
  schedule:
    - cron: "0 6 * * 6"  # 2am EST every Saturday
  workflow_dispatch:

jobs:

  Backup:
    # Action dashboard identified by 'Backup extraction'
    name: Typhon
    runs-on: self-hosted
    timeout-minutes: 720
    strategy:
      fail-fast: false

    steps:
      - name: Bump previous backup, if any
        run: |
          [ -e /data/dandi/s3-logs/extraction_cache/records.backup ] && mv /data/dandi/s3-logs/extraction_cache/records.backup /data/dandi/s3-logs/extraction_cache/records.backup2 || true
          [ -e /data/dandi/s3-logs/extraction_cache/extraction.backup ] && mv /data/dandi/s3-logs/extraction_cache/extraction.backup /data/dandi/s3-logs/extraction_cache/extraction.backup2 || true
    
      - name: Generate fresh backup
        run: |
          pwd
          cp -r /data/dandi/s3-logs/extraction_cache/records /data/dandi/s3-logs/extraction_cache/records.backup
          mkdir /data/dandi/s3-logs/extraction_cache/extraction.backup || true
          mkdir /data/dandi/s3-logs/extraction_cache/extraction.backup/blobs  || true
          mkdir /data/dandi/s3-logs/extraction_cache/extraction.backup/zarr  || true
          for head in {0..9} {a..f}; do
            echo Copying blobs/$head...
            cp -r /data/dandi/s3-logs/extraction_cache/extraction/blobs/$head* /data/dandi/s3-logs/extraction_cache/extraction.backup/blobs/
            echo Copying zarr/$head...
            cp -r /data/dandi/s3-logs/extraction_cache/extraction/zarr/$head* /data/dandi/s3-logs/extraction_cache/extraction.backup/zarr/
          done

      - name: Remove previous backup
        run: |
          rm -rf /data/dandi/s3-logs/extraction_cache/records.backup2
          for head in {0..9} {a..f}; do
            echo Cleaning .backup2/blobs/$head...
            rm -rf /data/dandi/s3-logs/extraction_cache/extraction.backup2/blobs/$head* 2>/dev/null
            echo Cleaning .backup2/zarr/$head...
            rm -rf /data/dandi/s3-logs/extraction_cache/extraction.backup2/zarr/$head* 2>/dev/null
          done

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [Backup]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Typhon S3 Log Extraction Backup Failed"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            The scheduled run of S3 log extraction backup encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/backup-extraction.yml
