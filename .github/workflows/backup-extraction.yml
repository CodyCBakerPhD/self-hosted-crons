name: Backup extraction
on:
  schedule:
    - cron: "0 10 * * 1"   # 6am EST every monday
  workflow_dispatch:

jobs:

  run:
    # Action dashboard identified by 'Backup extraction'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Remove any previous backup2
        run: |
          rm -rf /data/dandi/s3-logs/extraction_cache/records.backup2
          rm -rf /data/dandi/s3-logs/extraction_cache/extraction.backup2
    
      - name: Copy backup to backup2
        run: |
          cp -r /data/dandi/s3-logs/extraction_cache/records /data/dandi/s3-logs/extraction_cache/records.backup2
          cp -r /data/dandi/s3-logs/extraction_cache/extraction /data/dandi/s3-logs/extraction_cache/extraction.backup2

      - name: Remove previous backup
        run: |
          rm -rf /data/dandi/s3-logs/extraction_cache/records.backup
          rm -rf /data/dandi/s3-logs/extraction_cache/extraction.backup

      - name: Rename backup2
        run: |
          mv /data/dandi/s3-logs/extraction_cache/records.backup2 /data/dandi/s3-logs/extraction_cache/records.backup
          mv /data/dandi/s3-logs/extraction_cache/extraction.backup2 /data/dandi/s3-logs/extraction_cache/extraction.backup
