name: pre-commit
on:
  workflow_call:
    secrets:
      _API_TOKEN_GITHUB:
        description: 'GitHub Token for pushing back automatic changes'
        required: false

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / pre-commit / run'
    # Action dashboard identified by 'pre-commit'
    # Requirement settings identified as 'pre-commit / run'
    name: run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets._API_TOKEN_GITHUB || github.token }}  # Requires a custom token to re-trigger from pre-commit
        ref: ${{ github.head_ref }}
        persist-credentials: false  # prevents the token from being reused in subsequent steps
        fetch-depth: 0  # otherwise, there would be errors pushing refs to the destination repository
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Set cache hash
      run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
    - name: Cache pre-commit
      id: cache-pre-commit
      uses: actions/cache@v5
      with:
        path: |
          ~/pre_commit_environment
          ~/.cache/pre-commit/
        key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}|${{ github.ref }}
    - if: steps.cache-pre-commit.outputs.cache-hit == false
      name: Install a virtual environment with pre-commit
      run: |
        python -m venv ~/pre_commit_environment
        source ~/pre_commit_environment/bin/activate
        python -m pip install -U pip
        python -m pip install pre-commit
        pre-commit install

    - name: Run pre-commit
      run: | # Run thrice for error when pre-commit is missing; also because situations have been seen requiring three runs
        source ~/pre_commit_environment/bin/activate
        pre-commit run --all-files || pre-commit run --all-files || pre-commit run --all-files

    - name: Determine if changes were made
      id: check_changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
            echo "CHANGES=true" >> $GITHUB_ENV;
        fi

    - name: Add and commit changes
      run: |  # `|| true` below to skip if nothing changed from pre-commit
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "pre-commit" -a || true

    - name: Capture pre-commit commit SHA
      id: precommit_sha
      if: env.CHANGES == 'true'
      run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Push changes
      uses: ad-m/github-push-action@v1.1.0
      with:
        github_token: ${{ secrets._API_TOKEN_GITHUB || github.token }}
        branch: ${{ github.head_ref }}

    - name: Report pre-commit passed on fixed commit
      if: env.CHANGES == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        NEW_SHA: ${{ steps.precommit_sha.outputs.sha }}
      run: |
        printf '{"name":"Deploy / pre-commit / run","head_sha":"%s","status":"completed","conclusion":"success","output":{"title":"Pre-commit auto-fixes applied","summary":"Pre-commit automatically applied formatting fixes. All checks now pass on the updated commit."}}' "$NEW_SHA" | \
          gh api repos/${{ github.repository }}/check-runs --method POST -H "Accept: application/vnd.github+json" --input -

    - name: Send fail signal if changes were detected
      if: env.CHANGES == 'true'
      run: exit 1
