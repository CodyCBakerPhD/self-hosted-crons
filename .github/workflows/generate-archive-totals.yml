name: Generate archive totals
on:
  workflow_call:
  workflow_dispatch:

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / GenerateArchiveTotals / Typhon'
    # Action dashboard identified by 'Generate archive totals'
    # Requirement settings identified as 'GenerateArchiveTotals / Typhon'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Generate archive totals
        run: |
          conda activate s3_logs_cron
          s3logextraction update totals --mode archive
