name: Update region coordinates
on:
  workflow_call:
    secrets:
      OPENCAGE_API_KEY:
        required: true
      IPINFO_API_KEY:
        required: true

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / UpdateCoordinates / Typhon'
    # Action dashboard identified by 'Update region coordinates'
    # Requirement settings identified as 'UpdateCoordinates / Typhon'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Update region codes to coordinates
        run: |
          export OPENCAGE_API_KEY=${{ secrets.OPENCAGE_API_KEY }}
          export IPINFO_CREDENTIALS=${{ secrets.IPINFO_API_KEY }}
          conda activate s3_logs_cron
          s3logextraction update ip regions
