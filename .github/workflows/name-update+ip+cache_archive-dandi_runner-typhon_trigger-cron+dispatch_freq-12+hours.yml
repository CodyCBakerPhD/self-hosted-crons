name: Update DANDI IP cache

on:
  schedule:
    - cron: "0 1/4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: ${{ vars.DANDI_S3_LOG_BASE_PATH }}
  ENV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/${{ vars.S3LOGS_ENV_NAME }}"
  UV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/uv"
  FLOCK_FILE: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}
  OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Validate required variables
        run: |
          [ -n "${{ vars.DANDI_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable DANDI_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateIPCaches:
    needs: CheckTyphon
    name: Update IP caches
    runs-on: [self-hosted, typhon, dandi]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update IP regions
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip regions --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --batch-limit 1 --encryption false
          flock_file: ${{ env.FLOCK_FILE }}

      - name: Update region coordinates
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip coordinates --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --encryption false
          flock_file: ${{ env.FLOCK_FILE }}

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateIPCaches]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI IP cache update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            A scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-update+ip+cache_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-12+hours.yml
