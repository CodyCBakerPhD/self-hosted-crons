name: Update IP regions
on:
  workflow_call:
    secrets:
      IPINFO_API_KEY:
        required: true

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / UpdateIpRegions / Typhon'
    # Action dashboard identified by 'Update IP regions'
    # Requirement settings identified as 'UpdateIpRegions / Typhon'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Update region codes to coordinates
        run: |
          export IPINFO_API_KEY=${{ secrets.IPINFO_API_KEY }}
          source /data/dandi/s3-logs/conda/bin/activate s3_logs_cron
          s3logextraction update ip regions
