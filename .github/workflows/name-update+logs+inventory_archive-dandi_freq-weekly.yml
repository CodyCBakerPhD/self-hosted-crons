name: Update log inventory
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  S3_LOG_BASE_PATH: ${{ vars.DANDI_S3_LOG_BASE_PATH || '/mnt/s3-logs/dandi-s3-logs' }}
  ENV_PATH: ${{ format('{0}/name-s3logs_py-314_date-51426_env', vars.DANDI_S3_LOG_BASE_PATH || '/mnt/s3-logs/dandi-s3-logs') }}
  UV_PATH: ${{ format('{0}/uv', vars.DANDI_S3_LOG_BASE_PATH || '/mnt/s3-logs/dandi-s3-logs') }}

jobs:

  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateLogInventory:
    needs: CheckTyphon
    name: Update log inventory
    runs-on: [self-hosted, typhon, dandi]

    steps:
      - name: Update log inventory
        working-directory: ${{ env.S3_LOG_BASE_PATH }}/inventory
        run: |
          source ${{ env.ENV_PATH }}/bin/activate
          s5cmd sync --size-only 's3://dandiarchive-inventory/dandiarchive-logs/LogsWeeklyInventory/*' .

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateLogInventory]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Update log inventory failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            The scheduled run of S3 log inventory updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-update+logs+inventory_archive-dandi_freq-weekly.yml
