# One-off migration of the DANDI IP caches from IPInfo/OpenCage labels to MaxMind GeoLite2 labels.
#
# Region labels changed from `<alpha-2>/<region name>` (`US/California`) to
# `<alpha-3>/<ISO 3166-2 subdivision>` (`USA/CA`), so a cache holding both formats would split one
# place into two regions and double-count countries in the summaries. Geolocation is now a local
# lookup with no quota, so the whole cache is rebuilt from scratch in one pass instead.
#
# This is deliberately manual and must NOT be folded into the recurring pipeline: it deletes and
# rebuilds `ip_to_region.yaml` and `region_codes_to_coordinates.yaml`. Backups are taken first.
name: Migrate DANDI IP cache to GeoLite2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to confirm deleting and rebuilding the IP caches (backups are taken first).'
        required: true
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: ${{ vars.DANDI_S3_LOG_BASE_PATH }}
  ENV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/${{ vars.S3LOGS_ENV_NAME }}"
  UV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/uv"
  FLOCK_FILE: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "MIGRATE" ] || { echo "Confirmation input must be exactly 'MIGRATE'."; exit 1; }

      - name: Validate required variables
        run: |
          [ -n "${{ vars.DANDI_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable DANDI_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }
          [ -n "$MAXMIND_ACCOUNT_ID" ] || { echo "Repository secret MAXMIND_ACCOUNT_ID must be set."; exit 1; }
          [ -n "$MAXMIND_LICENSE_KEY" ] || { echo "Repository secret MAXMIND_LICENSE_KEY must be set."; exit 1; }

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  MigrateIPCaches:
    needs: CheckTyphon
    name: Migrate IP caches
    runs-on: [self-hosted, typhon, dandi]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install the GeoLite2-era packages
        uses: ./.github/actions/install-s3logextraction
        with:
          flock_file: ${{ env.FLOCK_FILE }}

      - name: Download the GeoLite2 database
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip database --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          flock_file: ${{ env.FLOCK_FILE }}

      - name: Back up and remove the old IP caches
        working-directory: ${{ env.S3_LOG_BASE_PATH }}/extraction_cache/ips
        run: |
          set -euo pipefail
          suffix=$(date +%Y-%m-%d)
          for cache_file in ip_to_region region_codes_to_coordinates; do
            if [ ! -f "${cache_file}.yaml" ]; then
              echo "${cache_file}.yaml is already absent; nothing to back up."
              continue
            fi
            cp "${cache_file}.yaml" "${cache_file}.${suffix}.yaml.bak"
            echo "Backed up ${cache_file}.yaml to ${cache_file}.${suffix}.yaml.bak"
            rm "${cache_file}.yaml"
          done
          ls -la

      - name: Rebuild IP regions
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip regions --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --encryption false
          flock_file: ${{ env.FLOCK_FILE }}

      - name: Rebuild region coordinates
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip coordinates --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --encryption false
          flock_file: ${{ env.FLOCK_FILE }}

      - name: Verify the rebuilt region labels
        run: |
          set -euo pipefail
          source ${{ env.ENV_PATH }}/bin/activate
          python ${{ github.workspace }}/.github/scripts/verify_ip_to_region.py \
            --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache \
            --encryption false

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, MigrateIPCaches]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI IP cache GeoLite2 migration failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The one-off GeoLite2 IP cache migration encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-migrate+ip+cache+geolite2_archive-dandi_runner-typhon_trigger-dispatch.yml
