# Separate action for the gargantuan dataset of DANDI:000108
name: Generate DANDI microscopy summaries
on:
  schedule:
    - cron: "0 3 * * 1"  # 11pm every Sunday (ET)
  workflow_dispatch:

env:
  CONDA_BASE_PATH: "/data/dandi/s3-logs/conda"
  CONDA_ENV_NAME: "s3_logs_cron"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}
  OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}

jobs:

  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  ProcessAccessLogs:
    needs: CheckTyphon
    name: Process access logs
    runs-on: [self-hosted, typhon, dandi]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Generate DANDI:000108 summaries"
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --mode dandi --pick 000108
