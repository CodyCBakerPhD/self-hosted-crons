name: Update BIDS Dandisets

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  _GITHUB_API_KEY: ${{ secrets._GITHUB_API_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          label: typhon
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateBidsDandisets:
    needs: CheckTyphon
    name: Typhon
    runs-on: self-hosted

    steps:
      - name: Update BIDS-Dandisets
        run: |
          source /data/dandi/s3-logs/conda/bin/activate bids_dandisets
          cd /data/dandi/bids-dandisets/scripts
          git pull
          cd /data/dandi/bids-dandisets/nwb2bids
          git pull
          cd /data/dandi/bids-dandisets
          python /data/dandi/bids-dandisets/scripts/scripts/parallel_generate.py
          cat /data/dandi/bids-dandisets/scripts/.parallel_logs/*.log || echo "No errors found in logs."
          rm -rf /data/dandi/bids-dandisets/scripts/.parallel_logs
        env:
          SANITIZATION_LEVEL: 0

#      - name: Run generation script with minimal sanitization
#        run: python scripts/parallel_generate.py
#        env:
#          SANITIZATION_LEVEL: 1

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ UpdateBidsDandisets ]
    if: ${{ always() && needs.UpdateBidsDandisets.result == 'failure' }}
    steps:
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: BIDS-Dandisets Update"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: bids-dandisets
          body: "Please check the latest run of the BIDS-Dandisets generation: https://github.com/bids-dandisets/scripts/actions/workflows/update-bids-dandisets.yml"
