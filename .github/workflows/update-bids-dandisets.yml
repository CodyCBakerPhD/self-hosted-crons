name: Update BIDS Dandisets

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  _GITHUB_API_KEY: ${{ secrets._GITHUB_API_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          label: typhon
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateBidsDandisets:
    needs: CheckTyphon
    name: Typhon
    runs-on: self-hosted

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
    
      - name: Clone package with script
        run: git clone https://github.com/bids-dandisets/scripts.git

      - name: Install package
        run: pip install -e git+https://github.com/con/nwb2bids@main#egg=nwb2bids[dandi]

      - name: Run generation script
        run: python scripts/scripts/parallel_generate.py
        #run: python ./bids-dandisets/scripts/generate.py
        env:
          SANITIZATION_LEVEL: 0

      - name: Printout all errors from parallel logs
        run: cat ./.parallel_logs/*.log || echo "No errors found in logs."

#      - name: Run generation script with minimal sanitization
#        run: python scripts/parallel_generate.py
#        env:
#          SANITIZATION_LEVEL: 1

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ UpdateBidsDandisets ]
    if: ${{ always() && needs.UpdateBidsDandisets.result == 'failure' }}
    steps:
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: BIDS-Dandisets Update"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: bids-dandisets
          body: "Please check the latest run of the BIDS-Dandisets generation: https://github.com/bids-dandisets/scripts/actions/workflows/update-bids-dandisets.yml"
