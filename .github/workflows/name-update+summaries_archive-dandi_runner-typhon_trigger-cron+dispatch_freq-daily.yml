name: Update DANDI summaries

on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: ${{ vars.DANDI_S3_LOG_BASE_PATH }}
  CONDA_BASE_PATH: ${{ format('{0}/conda', vars.DANDI_S3_LOG_BASE_PATH) }}
  CONDA_ENV_NAME: "name-s3+logs+processing_py-3+13_env"
  ENV_PATH: ${{ format('{0}/{1}', vars.DANDI_S3_LOG_BASE_PATH, vars.S3LOGS_ENV_NAME) }}
  UV_PATH: ${{ format('{0}/uv', vars.DANDI_S3_LOG_BASE_PATH) }}
  FLOCK_FILE: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Validate required variables
        run: |
          [ -n "${{ vars.DANDI_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable DANDI_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateDandiSummaries:
    needs: CheckTyphon
    name: Update DANDI summaries
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 2880  # 48 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update IP indexes
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip indexes
          flock_file: ${{ env.FLOCK_FILE }}

      - name: Generate Dandiset summaries
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --skip 000108 --directory ${{ env.S3_LOG_BASE_PATH }}/extraction_summaries
          flock_file: ${{ env.FLOCK_FILE }}
          entrypoint: 'dandis3logextraction'

      - name: Generate archive summaries
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --mode archive --directory ${{ env.S3_LOG_BASE_PATH }}/extraction_summaries
          flock_file: ${{ env.FLOCK_FILE }}
          entrypoint: 'dandis3logextraction'

      - name: Generate Dandiset totals
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update totals
          flags: --directory ${{ env.S3_LOG_BASE_PATH }}/extraction_summaries
          flock_file: ${{ env.FLOCK_FILE }}
          entrypoint: 'dandis3logextraction'

      - name: Generate archive totals
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update totals
          flags: --mode archive --directory ${{ env.S3_LOG_BASE_PATH }}/extraction_summaries
          flock_file: ${{ env.FLOCK_FILE }}
          entrypoint: 'dandis3logextraction'

      - name: Upload summaries
        uses: ./.github/actions/upload-summaries
        with:
          extraction_cache_path: ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          repository_path: ${{ env.S3_LOG_BASE_PATH }}/access-summaries

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateDandiSummaries]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI access summaries update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-update+summaries_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-daily.yml
