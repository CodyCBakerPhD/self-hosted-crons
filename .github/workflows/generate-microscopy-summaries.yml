# Separate action for the gargantuan dataset of 000108
name: Generate microscopy summaries
on:
  schedule:
    - cron: "0 10 * * 1"   # 6am EST every monday
  workflow_dispatch:

jobs:

  run:
    # Action dashboard identified by 'Generate microscopy summaries'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Update microscopy summaries
        run: |
          source /data/dandi/s3-logs/conda/bin/activate s3_logs_cron
          s3logextraction update summaries --mode dandi --pick 000108
