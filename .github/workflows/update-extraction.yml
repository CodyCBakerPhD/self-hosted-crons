name: Update extracted log data
on:
  workflow_call:
    secrets:
      S3_LOG_EXTRACTION_PASSWORD:
        required: true

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / UpdateExtraction / Typhon'
    # Action dashboard identified by 'Update extracted log data'
    # Requirement settings identified as 'UpdateExtraction / Typhon'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Update region codes to coordinates
        run: |
          export S3_LOG_EXTRACTION_PASSWORD=${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
          source /data/dandi/s3-logs/conda
          conda activate s3_logs_cron
          s3logextraction extract s3://dandiarchive-logs/769362853226/us-east-2/dandiarchive --mode dandi-remote --manifest /data/dandi/s3-logs/extraction_cache/manifest_parsed.json --limit 75000
