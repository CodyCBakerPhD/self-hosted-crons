name: Deploy Typhon CRON

on:
  schedule:
    - cron: "0 2 * * *"   # 10pm EST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          label: typhon
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateExtraction:
    uses: ./.github/workflows/update-extraction.yml
    needs: CheckTyphon
    secrets:
      S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}

  UpdateIpIndexes:
    uses: ./.github/workflows/update-ip-indexes.yml
    needs: UpdateExtraction
    secrets:
      S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}

  UpdateIpRegions:
    uses: ./.github/workflows/update-ip-regions.yml
    needs: UpdateIpIndexes
    secrets:
      S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
      IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}

  UpdateRegionCoordinates:
    uses: ./.github/workflows/update-region-coordinates.yml
    needs: UpdateIpRegions
    secrets:
      OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
      IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}

  GenerateDandisetSummaries:
    uses: ./.github/workflows/generate-dandiset-summaries.yml
    needs: UpdateRegionCoordinates

  GenerateArchiveSummaries:
    uses: ./.github/workflows/generate-archive-summaries.yml
    needs: GenerateDandisetSummaries

  GenerateDandisetTotals:
    uses: ./.github/workflows/generate-dandiset-totals.yml
    needs: GenerateArchiveSummaries

  GenerateArchiveTotals:
    uses: ./.github/workflows/generate-archive-totals.yml
    needs: GenerateDandisetTotals

  UploadContent:
    uses: ./.github/workflows/upload-content.yml
    needs: GenerateArchiveTotals
    secrets:
      _GITHUB_API_KEY: ${{ secrets._GITHUB_API_KEY }}

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UploadContent]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Typhon S3 Log Extraction Update Failed"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/.github/workflows/typhon-s3-logs-cron.yml
