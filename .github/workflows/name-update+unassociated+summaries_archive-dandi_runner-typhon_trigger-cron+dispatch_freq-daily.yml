name: Update unassociated DANDI summaries

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: ${{ vars.DANDI_S3_LOG_BASE_PATH || '/mnt/s3-logs/dandi-s3-logs' }}
  ENV_PATH: ${{ vars.DANDI_ENV_PATH || format('{0}/name-s3logs_py-314_date-51426_env', vars.DANDI_S3_LOG_BASE_PATH || '/mnt/s3-logs/dandi-s3-logs') }}
  UV_PATH: ${{ format('{0}/uv', vars.DANDI_S3_LOG_BASE_PATH || '/mnt/s3-logs/dandi-s3-logs') }}
  FLOCK_FILE: "${{ vars.DANDI_S3_LOG_BASE_PATH || '/mnt/s3-logs/dandi-s3-logs' }}/flocks/s3logextraction.lock"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateDandiSummaries:
    needs: CheckTyphon
    name: Update DANDI summaries
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 4320  # 3 days

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update IP indexes
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip indexes
          flock_file: ${{ env.FLOCK_FILE }}

      - name: Generate unassociated summaries
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --unassociated --directory ${{ env.S3_LOG_BASE_PATH }}/extraction_summaries
          flock_file: ${{ env.FLOCK_FILE }}
          entrypoint: 'dandis3logextraction'

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateDandiSummaries]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI unassociated usage summaries update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-update+unassociated+summaries_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-daily.yml
