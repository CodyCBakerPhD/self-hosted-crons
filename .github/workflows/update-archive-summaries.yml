name: Update archive summaries
on:
  workflow_call:
    secrets:
      OPENCAGE_API_KEY:
        required: true
      IPINFO_API_KEY:
        required: true

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / UpdateArchiveSummaries / Drogon'
    # Action dashboard identified by 'Update archive summaries'
    # Requirement settings identified as 'UpdateArchiveSummaries / Drogon'
    name: Drogon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Update archive summaries
        run: |
          export OPENCAGE_API_KEY=${{ secrets.OPENCAGE_API_KEY }}
          export IPINFO_CREDENTIALS=${{ secrets.IPINFO_API_KEY }}
          source /home/dandi/miniconda3/etc/profile.d/conda.sh
          conda activate s3_logs_cron
          generate_archive_summaries \
            --mapped_s3_logs_folder_path /mnt/backup/dandi/dandiarchive-logs-mapped.cbaker239
