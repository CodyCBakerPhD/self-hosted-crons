name: Update DANDI IP cache (Typhon CRON)

on:
  schedule:
    - cron: "0 2/3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONDA_BASE_PATH: "/data/dandi/s3-logs/conda"
  CONDA_ENV_NAME: "s3_logs_cron"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}
  OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateIPCaches:
    needs: CheckTyphon
    name: Update IP caches
    runs-on: [self-hosted, typhon, dandi]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update IP regions
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip regions --batch-limit 1

      - name: Update region coordinates
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip coordinates

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateIPCaches]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI IP cache update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            A scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-update+ip+cache_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-daily.yml
