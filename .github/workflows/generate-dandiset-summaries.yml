name: Generate Dandiset summaries
on:
  workflow_call:
  workflow_dispatch:

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / GenerateDandisetSummaries / Typhon'
    # Action dashboard identified by 'Generate Dandiset summaries'
    # Requirement settings identified as 'GenerateDandisetSummaries / Typhon'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Update Dandiset summaries
        run: |
          source /data/dandi/s3-logs/conda/bin/activate s3_logs_cron
          s3logextraction update summaries --mode dandi --skip 000108
