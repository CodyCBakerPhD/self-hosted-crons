name: Deploy DANDI access logs (Typhon CRON)

on:
  schedule:
    - cron: "0 10 * * *"  # ~6am ET
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONDA_BASE_PATH: "/data/dandi/s3-logs/conda"
  CONDA_ENV_NAME: "s3_logs_cron"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}
  OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  ProcessAccessLogs:
    needs: CheckTyphon
    name: Process access logs
    runs-on: [self-hosted, typhon, dandi]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run primary S3 log extraction
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: extract s3://dandiarchive-logs/769362853226/us-east-2/dandiarchive
          flags: --mode dandi-remote --manifest /data/dandi/s3-logs/extraction_cache/manifest_parsed.json

      - name: Update IP indexes
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip indexes

      - name: Update IP regions
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip regions --batch-limit 3

      - name: Update region coordinates
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip coordinates

      - name: Generate Dandiset summaries
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --mode dandi --skip 000108

      - name: Generate archive summaries
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --mode archive

      - name: Generate Dandiset totals
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update totals
          flags: --mode dandi

      - name: Generate archive totals
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update totals
          flags: --mode archive

      - name: Upload summaries
        uses: ./.github/actions/upload-summaries
        with:
          extraction_cache_path: /data/dandi/s3-logs/extraction_cache
          repository_path: /data/dandi/s3-logs/access-summaries

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, ProcessAccessLogs]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI access log extraction update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/CodyCBakerPhD/self-hosted-crons/actions/workflows/name-process+access+logs_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-daily.yml
