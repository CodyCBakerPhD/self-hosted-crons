name: Upload content
on:
  workflow_call:
  workflow_dispatch:

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / UploadContent / Drogon'
    # Action dashboard identified by 'Upload content'
    # Requirement settings identified as 'UploadContent / Drogon'
    name: Drogon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
    - name: Move to and pull local clone of access-summaries repo
      run: |
        source /data/dandi/s3-logs/conda/bin/activate s3_logs_cron
        cd /data/dandi/s3-logs/extraction_cache/summaries
        find . -type f -name '*.tsv' -exec cp --parents {} /data/dandi/s3-logs/access-summaries/content/summaries/ \;
        find . -type f -name '*.json' -exec cp --parents {} /data/dandi/s3-logs/access-summaries/content/summaries/ \;
        cp ./totals.json /data/dandi/s3-logs/access-summaries/content
        cd /data/dandi/s3-logs/access-summaries
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git pull
        git branch
        cp \
          /data/dandi/s3-logs/extraction_cache/ips/region_codes_to_coordinates.json \
          /data/dandi/s3-logs/access-summaries/content/region_codes_to_coordinates.json
        git status
        git add content
        git commit -m "update S3 access summary content" || true
        git push
