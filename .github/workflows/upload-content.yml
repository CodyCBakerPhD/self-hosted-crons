name: Upload content
on:
  workflow_call:
    secrets:
      API_KEY_GITHUB:
        required: true

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / UploadContent / Drogon'
    # Action dashboard identified by 'Upload content'
    # Requirement settings identified as 'UploadContent / Drogon'
    name: Drogon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
    - name: Move to and pull local clone of access-summaries repo
      run: |
        cd /mnt/backup/dandi/dandiarchive-logs-cody/access-summaries
        source /home/dandi/miniconda3/etc/profile.d/conda.sh
        conda activate s3_logs_cron
        git pull
    
    - name: Copy latest cache files
      run: |
        cp \
        /mnt/backup/dandi/dandiarchive-logs-parser-cache/dandi_s3_log_parser/region_codes_to_coordinates.json \
        /mnt/backup/dandi/dandiarchive-logs-cody/access-summaries/content/region_codes_to_coordinates.json

    - name: Add and commit files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "update S3 access log summary content" -a || true
        git push
