name: Upload content
on:
  workflow_call:
  workflow_dispatch:

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / UploadContent / Drogon'
    # Action dashboard identified by 'Upload content'
    # Requirement settings identified as 'UploadContent / Drogon'
    name: Drogon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
    - name: Move to and pull local clone of access-summaries repo
      run: |
        source /home/dandi/miniconda3/etc/profile.d/conda.sh
        conda activate s3_logs_cron
        cd /mnt/backup/dandi/dandiarchive-logs-mapped.cbaker239
        find . -type f -name 'dandiset_summary*.tsv' -exec cp --parents {} /mnt/backup/dandi/dandiarchive-logs-cody/access-summaries/content/summaries/ \;
        cp *.tsv /mnt/backup/dandi/dandiarchive-logs-cody/access-summaries/content/summaries
        cp *.json /mnt/backup/dandi/dandiarchive-logs-cody/access-summaries/content
        cd /mnt/backup/dandi/dandiarchive-logs-cody/access-summaries
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git pull
        git branch
        cp \
          /mnt/backup/dandi/dandiarchive-logs-parser-cache/dandi_s3_log_parser/region_codes_to_coordinates.json \
          /mnt/backup/dandi/dandiarchive-logs-cody/access-summaries/content/region_codes_to_coordinates.json
        git status
        git add content
        git commit -m "update S3 access log summary content" || true
        git push
