name: Upload content
on:
  workflow_call:
    secrets:
      _GITHUB_API_KEY:
        required: true

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / UploadContent / Typhon'
    # Action dashboard identified by 'Upload content'
    # Requirement settings identified as 'UploadContent / Typhon'
    name: Typhon
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
    - name: Move to and pull local clone of access-summaries repo
      run: |
        source /data/dandi/s3-logs/conda/bin/activate s3_logs_cron
        cd /data/dandi/s3-logs/extraction_cache/summaries
        find . -type f -name '*.tsv' -exec cp --parents {} /data/dandi/s3-logs/access-summaries/content/summaries/ \;
        cp ./archive_totals.json /data/dandi/s3-logs/access-summaries/content
        cp ./totals.json /data/dandi/s3-logs/access-summaries/content
        cp \
          /data/dandi/s3-logs/extraction_cache/ips/region_codes_to_coordinates.yaml \
          /data/dandi/s3-logs/access-summaries/content/region_codes_to_coordinates.yaml
        cd /data/dandi/s3-logs/access-summaries
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets._GITHUB_API_KEY }}@github.com/dandi/access-summaries.git
        git pull
        git branch
        git status
        git add content
        git commit -m "update S3 access summary content" || true
        git push
