name: Deploy EMBER Access Logs (Typhon CRON)

on:
#  schedule:
#    - cron: "0 8 * * *"  # 4am EST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  conda_base_path: "/data/ember/s3-logs/conda"
  conda_env_name: "s3_logs_cron"

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: CodyCBakerPhD/self-hosted-crons
          labels: typhon,ember
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateExtraction:
    needs: CheckTyphon
    name: Run extraction update
    runs-on: [self-hosted, typhon, ember]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EMBER S3 log extraction
        uses: ./.github/actions/run-s3logextraction
        with:
          conda_base_path: ${{ env.conda_base_path }}
          conda_env_name: ${{ env.conda_env_name }}
          command: extract s3://ember-open-data-logs/650477180493/us-east-1/ember-open-data
          flags: --mode dandi-remote --manifest /data/ember/s3-logs/extraction_cache/manifest_parsed.json
        env:
          S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}

#  UpdateIpIndexes:
