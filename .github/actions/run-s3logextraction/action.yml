name: Check self-hosted runner
description: Used to immediately cancel workflow if self-hosted runner isn't online.

inputs:
  conda_base_path:
    description: Base path to conda installation.
    required: true
  conda_env_name:
    description: Name of conda environment to activate.
    required: true
  command:
    description: |
      "`s3logextraction` command to run after activating conda environment. 
      "Use spaces to separate command groups."
    required: true
  flags:
    description: Space-separated, double-dash flags to pass to the script. For example, '--mode archive'.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - shell: bash
      name: Activate conda environment and run command
      run: |
        source ${{ inputs.conda_base_path }}/bin/activate ${{ inputs.conda_env_name }}
        s3logextraction ${{ inputs.command }} ${{ inputs.flags }}
