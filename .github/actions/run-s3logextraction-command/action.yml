name: Run `s3logextraction` command
description: |
  Run the `s3logextraction` command within a specified environment.
  Requires multiple environment variables to be set, including `ENV_PATH` and `UV_PATH`.
  Some commands may also require `S3_LOG_EXTRACTION_PASSWORD` and other API keys.
  Can override the `entrypoint` to use plugins such as `dandis3logextraction`.


inputs:
  command:
    description: |
      `s3logextraction` command to run after activating the environment.
      Use spaces to separate command groups.
    required: true
  flags:
    description: Space-separated, double-dash flags to pass to the script. For example, `--mode archive`.
    required: false
    default: ""
  entrypoint:
    description: The CLI entrypoint to use. Defaults to `s3logextraction`.
    required: false
    default: "s3logextraction"
  flock_file:
    description: |
      Path to a file to use for flocking.
      Defaults to `$S3_LOG_BASE_PATH/flocks/s3logextraction.lock` when
      `S3_LOG_BASE_PATH` is set, or `/mnt/s3-logs/dandi-s3-logs/flocks/s3logextraction.lock` otherwise.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - shell: bash
      name: Activate environment and run command
      run: |
        FLOCK_FILE="${{ inputs.flock_file }}"
        if [[ -z "$FLOCK_FILE" ]]; then
          if [[ -n "${S3_LOG_BASE_PATH:-}" ]]; then
            FLOCK_FILE="${S3_LOG_BASE_PATH}/flocks/s3logextraction.lock"
          else
            FLOCK_FILE="/mnt/s3-logs/dandi-s3-logs/flocks/s3logextraction.lock"
          fi
        fi

        source ${{ env.ENV_PATH }}/bin/activate
        flock -n "$FLOCK_FILE" ${{ env.UV_PATH }} run duct ${{ inputs.entrypoint }} ${{ inputs.command }} ${{ inputs.flags }}
